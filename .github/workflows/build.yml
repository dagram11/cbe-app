name: Build Android APK
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v5.5.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check and Repair Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found in root. Checking subdirectories..."
            # Try to find gradlew if it's nested
            NESTED_GRADLEW=$(find . -name gradlew | head -n 1)
            if [ ! -z "$NESTED_GRADLEW" ]; then
              echo "Found gradlew at $NESTED_GRADLEW. Moving execution context..."
              cd $(dirname "$NESTED_GRADLEW")
            else
              echo "gradlew missing completely. Installing a clean wrapper..."
              sudo apt-get update && sudo apt-get install -y gradle
              gradle wrapper
            fi
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          # Dynamically run the build wherever gradlew lives
          NESTED_GRADLEW=$(find . -name gradlew | head -n 1)
          cd $(dirname "$NESTED_GRADLEW")
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4.6.1
        with:
          name: cbe-app-debug-apk
          path: "**/build/outputs/apk/debug/*-debug.apk"
