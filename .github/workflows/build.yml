name: Build Android APK
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v5.5.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Modern Gradle Wrapper
        run: |
          # Download and install Gradle 8.5 binaries locally inside the runner
          wget -q https://gradle.org
          sudo unzip -q gradle-8.5-bin.zip -d /opt
          export PATH=/opt/gradle-8.5/bin:$PATH
          
          # Force generate a modern, Java 17-compatible gradle wrapper
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4.6.1
        with:
          name: cbe-app-debug-apk
          path: "app/build/outputs/apk/debug/app-debug.apk"
